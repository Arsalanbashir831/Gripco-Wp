services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./mwp_db/10-import.sh:/docker-entrypoint-initdb.d/10-import.sh:ro
      - ./mwp_db/db_dom274807.sql:/dump/wordpress.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - backend

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_an4rpmm56b_}
      WP_HOME: ${WP_HOME:-https://gripcosaudia.com}
      WP_SITEURL: ${WP_SITEURL:-https://gripcosaudia.com}
      WP_ENVIRONMENT_TYPE: production
      WP_AUTH_KEY: ${WP_AUTH_KEY:?Set WordPress salts in .env}
      WP_SECURE_AUTH_KEY: ${WP_SECURE_AUTH_KEY:?Set WordPress salts in .env}
      WP_LOGGED_IN_KEY: ${WP_LOGGED_IN_KEY:?Set WordPress salts in .env}
      WP_NONCE_KEY: ${WP_NONCE_KEY:?Set WordPress salts in .env}
      WP_AUTH_SALT: ${WP_AUTH_SALT:?Set WordPress salts in .env}
      WP_SECURE_AUTH_SALT: ${WP_SECURE_AUTH_SALT:?Set WordPress salts in .env}
      WP_LOGGED_IN_SALT: ${WP_LOGGED_IN_SALT:?Set WordPress salts in .env}
      WP_NONCE_SALT: ${WP_NONCE_SALT:?Set WordPress salts in .env}
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - proxy
      - backend

volumes:
  db_data:

networks:
  proxy:
  backend:
    internal: true
