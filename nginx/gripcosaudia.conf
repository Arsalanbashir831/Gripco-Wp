server {
    listen 80;
    listen [::]:80;
    server_name gripcosaudia.com www.gripcosaudia.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://gripcosaudia.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gripcosaudia.com www.gripcosaudia.com;

    ssl_certificate /etc/letsencrypt/live/gripcosaudia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gripcosaudia.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.gripcosaudia.com) {
        return 301 https://gripcosaudia.com$request_uri;
    }

    access_log /var/log/nginx/gripcosaudia.access.log;
    error_log /var/log/nginx/gripcosaudia.error.log warn;

    client_max_body_size 64M;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /xmlrpc.php {
        return 403;
    }

    location ~ ^/(?:\.git(?:/|$)|\.env(?:\.|$)|mwp_db(?:/|$)|071D757F\.tar_bv_|phpinfo\.php|wp-config(?:-sample)?\.php$) {
        return 404;
    }

    location ~* ^/wp-content/uploads/.*\.php$ {
        return 403;
    }

    location = /wp-login.php {
        limit_req zone=gripco_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/gripco-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/gripco-proxy.conf;
    }
}
